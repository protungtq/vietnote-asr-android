name: Build trial APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.9"

      - name: Restore shared debug keystore
        run: |
          echo "" | base64 -d > debug.keystore
          ls -la debug.keystore

      - name: Download sherpa-onnx AAR (2.0.3)
        run: |
          mkdir -p app/libs
          curl -sL -o app/libs/sherpa-onnx-2.0.3.aar https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.3/sherpa-onnx-2.0.3.aar
          test $(stat -c%s app/libs/sherpa-onnx-2.0.3.aar) -gt 10000000
          ls -la app/libs/

      - name: Download VietNote streaming model (int8)
        run: |
          mkdir -p app/src/main/assets/model
          base=https://huggingface.co/Kaisye/VietNote-Zipformer-78M-Streaming/resolve/main/streaming/int8
          curl -sL -o app/src/main/assets/model/encoder.int8.onnx $base/encoder.int8.onnx
          curl -sL -o app/src/main/assets/model/decoder.int8.onnx $base/decoder.int8.onnx
          curl -sL -o app/src/main/assets/model/joiner.int8.onnx $base/joiner.int8.onnx
          curl -sL -o app/src/main/assets/model/tokens.txt $base/tokens.txt
          test $(stat -c%s app/src/main/assets/model/encoder.int8.onnx) -gt 10000000
          test $(stat -c%s app/src/main/assets/model/decoder.int8.onnx) -gt 1000000
          test $(stat -c%s app/src/main/assets/model/joiner.int8.onnx) -gt 1000000
          test $(stat -c%s app/src/main/assets/model/tokens.txt) -gt 10000
          ls -la app/src/main/assets/model/

      - name: Download Piper Vietnamese TTS voice (vais1000-medium)
        run: |
          mkdir -p app/src/main/assets/tts
          base=https://huggingface.co/rhasspy/piper-voices/resolve/main/vi/vi_VN/vais1000/medium
          curl -sL -o app/src/main/assets/tts/vi_VN-vais1000-medium.onnx $base/vi_VN-vais1000-medium.onnx
          curl -sL -o app/src/main/assets/tts/vi_VN-vais1000-medium.onnx.json $base/vi_VN-vais1000-medium.onnx.json
          test $(stat -c%s app/src/main/assets/tts/vi_VN-vais1000-medium.onnx) -gt 10000000
          test $(stat -c%s app/src/main/assets/tts/vi_VN-vais1000-medium.onnx.json) -gt 1000
          ls -la app/src/main/assets/tts/

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VietNote-ASR-0.2.0
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
